name: Axiom Zeta bridge

on:
  push:
    branches:
      - "feat/axiom-zeta-rvm-bridge"
    paths:
      - "lean/axiom-zeta-bridge/**"
      - ".github/workflows/axiom-zeta-bridge.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lean/axiom-zeta-bridge/**"
      - ".github/workflows/axiom-zeta-bridge.yml"
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        working-directory: lean/axiom-zeta-bridge
        run: lake update
      - name: Fetch Mathlib build cache
        working-directory: lean/axiom-zeta-bridge
        run: lake exe cache get
      - name: Build bridge and imported upstream modules
        working-directory: lean/axiom-zeta-bridge
        run: lake build
      - name: Print theorem axioms
        working-directory: lean/axiom-zeta-bridge
        run: lake env lean PrintAxioms.lean
      - name: Reject unfinished Lean proofs
        working-directory: lean/axiom-zeta-bridge
        run: |
          if grep -R -n -w --include='*.lean' 'sorry' RiemannLabs RiemannLabsZetaBridge.lean PrintAxioms.lean; then
            echo "Unfinished Lean proof found."
            exit 1
          fi
